<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视频剪辑 Demo</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="editor.js"></script>
  <script defer src="ui.js"></script>
</head>
<body>
  <main>
    <h1>视频剪辑 Demo</h1>
    <video id="preview" src="assets/sample-browser.mp4" playsinline preload="metadata"
      aria-label="示例视频"></video>
    <section aria-label="剪辑时间轴">
      <div class="timeline-heading">
        <label for="position">时间轴</label>
        <output id="time">0.00 秒</output>
      </div>
      <input id="position" type="range" min="0" max="0" step="any" value="0" disabled>
      <div class="track">
        <div id="clips" class="clips" aria-label="画面片段"></div>
        <div id="playhead" class="playhead" aria-hidden="true"></div>
      </div>
    </section>
    <div class="actions">
      <button id="play" class="action" type="button" disabled>播放</button>
      <button id="add" class="action" type="button">添加视频</button>
      <button id="split" class="action" type="button" disabled>分割</button>
      <button id="delete" class="action" type="button" disabled>删除</button>
    </div>
    <input id="file" type="file" accept="video/*" hidden>
    <p id="status" role="status" hidden></p>
  </main>
</body>
</html>
